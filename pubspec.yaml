name: reproductor_mp3

description: Un reproductor de música en Flutter con soporte para transiciones y turntables visuales.

version: 1.0.0+1
environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.1.0
  permission_handler: ^11.3.0
  path_provider: ^2.1.2
  device_info_plus: ^12.2.0
  file_picker: ^11.0.3
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/sample.mp3